<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>xTract — Layout Variations</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="styles.css"/>
<style>
  body { background: #f0eee9; }
  .vlabel { font-family: var(--font-sans); font-size: 12px; color: #5a4a2a; margin-bottom: 8px; opacity: 0.75; }
  iframe { border: 0; background: var(--surface); display: block; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>

<script type="text/babel">
function App() {
  return (
    <DesignCanvas>
      <DCSection id="layouts" title="Review screen layouts" subtitle="Two takes on how the auditor reviews a doc">
        <DCArtboard id="split" label="A · Split (current)" width={1440} height={900}>
          <iframe src="xtract.html#review" style={{ width: 1440, height: 900 }}/>
        </DCArtboard>
        <DCArtboard id="inspector" label="B · Inspector rail" width={1440} height={900}>
          <iframe src="xtract-inspector.html" style={{ width: 1440, height: 900 }}/>
        </DCArtboard>
      </DCSection>
      <DCSection id="states" title="Other screens" subtitle="Empty · Upload · Processing · Queue · History · Save">
        <DCArtboard id="queue" label="Queue" width={1280} height={820}>
          <iframe src="xtract.html" style={{ width: 1280, height: 820 }}/>
        </DCArtboard>
        <DCArtboard id="history" label="History" width={1280} height={820}>
          <iframe src="xtract.html#history" style={{ width: 1280, height: 820 }} onLoad={e => {
            try { e.target.contentDocument.querySelector('.x-navitem:nth-of-type(3)')?.click(); } catch(err){}
          }}/>
        </DCArtboard>
        <DCArtboard id="upload" label="Upload" width={1280} height={820}>
          <iframe src="xtract.html" style={{ width: 1280, height: 820 }} onLoad={e => {
            try {
              const doc = e.target.contentDocument;
              setTimeout(() => doc.querySelector('.x-topbar__right .x-btn--ghost')?.click(), 300);
            } catch(err){}
          }}/>
        </DCArtboard>
        <DCArtboard id="processing" label="Processing" width={1280} height={820}>
          <iframe src="xtract-processing.html" style={{ width: 1280, height: 820 }}/>
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
