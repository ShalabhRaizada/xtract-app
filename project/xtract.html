<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>xTract — Freight Document Audit</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="styles.css"/>
</head>
<body>
<div id="root"></div>

<!-- React + Babel -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- Excel export (SheetJS) -->
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>

<!-- Tweaks shell -->
<script type="text/babel" src="tweaks-panel.jsx"></script>

<!-- Storage + export -->
<script type="text/babel" src="storage.jsx"></script>

<!-- Browser-side Claude extraction (fallback when server is unavailable) -->
<script type="text/babel" src="extraction.jsx"></script>

<!-- Data + assets -->
<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="doc-svgs.jsx"></script>

<!-- UI primitives -->
<script type="text/babel" src="components.jsx"></script>
<script type="text/babel" src="doc-viewer.jsx"></script>

<!-- Screens -->
<script type="text/babel" src="screens.jsx"></script>
<script type="text/babel" src="review-screen.jsx"></script>
<script type="text/babel" src="queue-history.jsx"></script>

<!-- Auth -->
<script type="text/babel" src="auth.jsx"></script>

<!-- App -->
<script type="text/babel" src="app.jsx"></script>
</body>
</html>
